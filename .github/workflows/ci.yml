name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: check
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/savdochi_ci?replicaSet=rs0&directConnection=true
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: MongoDB (replica set — tranzaksiyalar uchun)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'try{rs.status().ok}catch(e){rs.initiate().ok}' && break; sleep 2; done
      - run: npm ci
      - run: npm run build
      - name: Server va integratsiya testi
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          SAVDOCHI_TEST_URL=http://localhost:3000 npm run test:integration
      - if: failure()
        run: cat server.log
